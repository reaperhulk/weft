[package]
name = "weft"
version = "0.4.2"
edition = "2021"
description = "Fast parallel GIF encoder: raw RGBA or yuv4mpegpipe on stdin, GIF on stdout"
license = "Apache-2.0"

[dependencies]
fearless_simd = "0.7.0"
rayon = "1.10"

# musl's malloc is slow under multithreaded allocation; swap it out so the
# static binary matches the glibc build's speed.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[lints.clippy]
# The OkLab coefficients deliberately carry the reference implementation's
# full-precision digits; truncating them to f32 precision by hand would
# just obscure where they came from.
excessive_precision = "allow"

[profile.release]
# x86_64 builds get -C target-cpu=x86-64-v3 from .cargo/config.toml; the
# SIMD kernels are runtime-dispatched (fearless_simd) and pick AVX2/NEON
# on their own either way. A v3 build used to measure far SLOWER
# (quantize+lzw up to 1.6x): with AVX enabled LLVM packed the three cube
# roots in `oklab::srgb_to_oklab_fast` into one vector whose padding lane
# went subnormal on every call, and each subnormal operand is a
# ~150-cycle microcode assist. `cbrt3_fast` now writes that vector out
# explicitly with a safe pad lane, and v3 measures ~1.5% faster than
# baseline on 480x360 RGBA at 40 threads. x86-64-v4 and =native measured
# 2-4% slower than v3 on a Cascade Lake Xeon. PGO was also measured:
# neutral, since fat LTO + codegen-units=1 already settle layout.
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench-fast]
inherits = "release"
